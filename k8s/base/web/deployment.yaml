apiVersion: apps/v1
kind: Deployment
metadata:
  name: toimi-web
  namespace: apps
  labels:
    app: toimi-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: toimi-web
  template:
    metadata:
      labels:
        app: toimi-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654  # `app` user in the .NET base images (APP_UID)
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: toimi-web
          image: ${IMAGE_REGISTRY}/toimi-web:latest
          ports:
            - containerPort: 8080
          env:
            - name: TOIMI__OPENAI__APIKEY
              valueFrom:
                secretKeyRef:
                  name: toimi-secrets
                  key: openai-api-key
            - name: TOIMI__OPENAI__FASTMODEL
              value: "${OPENAI_MODEL_FAST}"
            # Smart model (may be empty) + prices come from toimi-secrets, not
            # envsubst: kustomize strips the quotes around substituted values,
            # so a number/empty would stop being a YAML string and the apply
            # would be rejected. Secret values are strings by construction.
            - name: TOIMI__OPENAI__SMARTMODEL
              valueFrom:
                secretKeyRef:
                  name: toimi-secrets
                  key: openai-model-smart
            - name: TOIMI__FASTPRICEINPUTPER1M
              valueFrom:
                secretKeyRef:
                  name: toimi-secrets
                  key: openai-price-fast-input-per-1m
            - name: TOIMI__FASTPRICEOUTPUTPER1M
              valueFrom:
                secretKeyRef:
                  name: toimi-secrets
                  key: openai-price-fast-output-per-1m
            - name: TOIMI__SMARTPRICEINPUTPER1M
              valueFrom:
                secretKeyRef:
                  name: toimi-secrets
                  key: openai-price-smart-input-per-1m
            - name: TOIMI__SMARTPRICEOUTPUTPER1M
              valueFrom:
                secretKeyRef:
                  name: toimi-secrets
                  key: openai-price-smart-output-per-1m
            - name: ConnectionStrings__Toimi
              valueFrom:
                secretKeyRef:
                  name: toimi-secrets
                  key: toimi-connection-string
            - name: HOME
              value: /tmp  # readOnlyRootFilesystem: $HOME writes (data-protection keys) land on the emptyDir
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
