apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: toimi-web
  namespace: apps
spec:
  ingressClassName: traefik
  rules:
    - host: ${TOIMI_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: toimi-web
                port:
                  number: 80
