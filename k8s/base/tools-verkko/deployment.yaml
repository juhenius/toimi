apiVersion: apps/v1
kind: Deployment
metadata:
  name: toimi-tools-verkko
  namespace: apps
  labels:
    app: toimi-tools-verkko
spec:
  replicas: 1
  selector:
    matchLabels:
      app: toimi-tools-verkko
  template:
    metadata:
      labels:
        app: toimi-tools-verkko
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654  # `app` user in the .NET base images (APP_UID)
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: toimi-tools-verkko
          image: ${IMAGE_REGISTRY}/toimi-tools-verkko:latest
          ports:
            - containerPort: 8080
          env:
            - name: Ntfy__BaseUrl
              valueFrom:
                secretKeyRef:
                  name: toimi-secrets
                  key: ntfy-base-url
            - name: Ntfy__Topic
              valueFrom:
                secretKeyRef:
                  name: toimi-secrets
                  key: ntfy-topic
            - name: Ntfy__Username
              valueFrom:
                secretKeyRef:
                  name: toimi-secrets
                  key: ntfy-username
            - name: Ntfy__Password
              valueFrom:
                secretKeyRef:
                  name: toimi-secrets
                  key: ntfy-password
            - name: HOME
              value: /tmp  # readOnlyRootFilesystem: $HOME writes (data-protection keys) land on the emptyDir
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
