apiVersion: apps/v1
kind: Deployment
metadata:
  name: toimi-tools-selain
  namespace: apps
  labels:
    app: toimi-tools-selain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: toimi-tools-selain
  template:
    metadata:
      labels:
        app: toimi-tools-selain
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654  # `app` user in the .NET base images (APP_UID)
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: toimi-tools-selain
          image: ${IMAGE_REGISTRY}/toimi-tools-selain:latest
          ports:
            - containerPort: 8080
          env:
            - name: Selain__PublicBaseUrl
              value: "https://${TOIMI_HOST}"
            - name: HOME
              value: /tmp  # readOnlyRootFilesystem: Chromium + data-protection writes land on the emptyDir
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
