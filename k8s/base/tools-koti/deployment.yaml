apiVersion: apps/v1
kind: Deployment
metadata:
  name: toimi-tools-koti
  namespace: apps
  labels:
    app: toimi-tools-koti
spec:
  replicas: 1
  selector:
    matchLabels:
      app: toimi-tools-koti
  template:
    metadata:
      labels:
        app: toimi-tools-koti
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654  # `app` user in the .NET base images (APP_UID)
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: toimi-tools-koti
          image: ${IMAGE_REGISTRY}/toimi-tools-koti:latest
          ports:
            - containerPort: 8080
          env:
            - name: HomeAssistant__BearerToken
              valueFrom:
                secretKeyRef:
                  name: toimi-secrets
                  key: ha-bearer-token
            - name: HomeAssistant__BaseUrl
              value: "${HOMEASSISTANT_BASE_URL}"
            - name: HOME
              value: /tmp  # readOnlyRootFilesystem: $HOME writes (data-protection keys) land on the emptyDir
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
