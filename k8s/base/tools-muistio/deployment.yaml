apiVersion: apps/v1
kind: Deployment
metadata:
  name: toimi-tools-muistio
  namespace: apps
  labels:
    app: toimi-tools-muistio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: toimi-tools-muistio
  template:
    metadata:
      labels:
        app: toimi-tools-muistio
    spec:
      containers:
        - name: toimi-tools-muistio
          image: ${IMAGE_REGISTRY}/toimi-tools-muistio:latest
          ports:
            - containerPort: 8080
          env:
            - name: ConnectionStrings__Muistio
              valueFrom:
                secretKeyRef:
                  name: toimi-secrets
                  key: muistio-connection-string
            - name: OpenAI__ApiKey
              valueFrom:
                secretKeyRef:
                  name: toimi-secrets
                  key: openai-api-key
            - name: Qdrant__Host
              value: qdrant.data.svc.cluster.local
            - name: Qdrant__Port
              value: "6334"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
