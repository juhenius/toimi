apiVersion: apps/v1
kind: Deployment
metadata:
  name: toimi-tools-ruutu
  namespace: apps
  labels:
    app: toimi-tools-ruutu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: toimi-tools-ruutu
  template:
    metadata:
      labels:
        app: toimi-tools-ruutu
    spec:
      containers:
        - name: toimi-tools-ruutu
          image: ${IMAGE_REGISTRY}/toimi-tools-ruutu:latest
          ports:
            - containerPort: 8080
          env:
            - name: ConnectionStrings__Ruutu
              valueFrom:
                secretKeyRef:
                  name: toimi-secrets
                  key: ruutu-connection-string
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
