apiVersion: apps/v1
kind: Deployment
metadata:
  name: toimi-tools-ruutu
  namespace: apps
  labels:
    app: toimi-tools-ruutu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: toimi-tools-ruutu
  template:
    metadata:
      labels:
        app: toimi-tools-ruutu
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654  # `app` user in the .NET base images (APP_UID)
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: toimi-tools-ruutu
          image: ${IMAGE_REGISTRY}/toimi-tools-ruutu:latest
          ports:
            - containerPort: 8080
          env:
            - name: ConnectionStrings__Ruutu
              valueFrom:
                secretKeyRef:
                  name: toimi-secrets
                  key: ruutu-connection-string
            - name: HOME
              value: /tmp  # readOnlyRootFilesystem: $HOME writes (data-protection keys) land on the emptyDir
            # Action forwards to ${TOIMI_HOST}/hooks/... are rewritten onto the
            # cluster-internal tietue service: no ingress hop, no TLS trust needed.
            - name: Actions__PublicHookHost
              value: ${TOIMI_HOST}
            - name: Actions__InternalHookBase
              value: "http://toimi-tools-tietue.apps.svc.cluster.local"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
