apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: toimi-web
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: toimi-ca-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - hosts:
        - ${TOIMI_HOST}
      secretName: toimi-web-tls
