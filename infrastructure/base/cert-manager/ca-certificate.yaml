apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: toimi-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: Toimi CA
  duration: 87600h  # 10 years
  privateKey:
    algorithm: RSA
    size: 4096
  secretName: toimi-ca-key-pair
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
